plugins {
    id 'com.android.application'
}

// Dirección donde están publicadas las apps (GitHub Pages). Cambiar aquí cuando se tenga dominio propio.
def BASE_URL = 'https://perezalvarezlucas23-max.github.io/lb-labanda-apps/'
def VERSION = System.getenv('VERSION_CODE') ?: '1'
def KEYSTORE = System.getenv('LB_KEYSTORE_PATH')

android {
    namespace 'co.labanda.app'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode = Integer.parseInt(VERSION)
        versionName = "1.0." + VERSION
    }

    flavorDimensions = ['app']
    productFlavors {
        cliente {
            dimension 'app'
            applicationId 'co.labanda.cliente'
            resValue 'string', 'app_name', 'La Banda'
            buildConfigField 'String', 'START_URL', "\"${BASE_URL}cliente/\""
        }
        equipo {
            dimension 'app'
            applicationId 'co.labanda.equipo'
            resValue 'string', 'app_name', 'LB Equipo'
            buildConfigField 'String', 'START_URL', "\"${BASE_URL}equipo/\""
        }
    }

    if (KEYSTORE) {
        signingConfigs {
            lb {
                storeFile = file(KEYSTORE)
                storePassword = System.getenv('LB_KEYSTORE_PASSWORD')
                keyAlias = 'labanda'
                keyPassword = System.getenv('LB_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = KEYSTORE ? signingConfigs.lb : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
